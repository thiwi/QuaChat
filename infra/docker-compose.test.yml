services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: quachat_test
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"  # anderer Port als Standard

  test-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.test
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/quachat_test
    command: ["pytest", "tests/"]
    volumes:
      - ../backend:/app
    depends_on:
      - postgres


  test-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.test
    working_dir: /app
    volumes:
      - ../frontend:/app